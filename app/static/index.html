<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Booking</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 720px; margin: 0 auto; padding: 40px 24px; line-height: 1.5;
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: #666; margin: 0 0 32px; font-size: 0.95rem; }
    form { display: grid; gap: 12px; margin-bottom: 12px; }
    label { display: grid; gap: 4px; font-size: 0.85rem; color: #555; }
    input, select { padding: 8px 10px; font-size: 1rem; font: inherit; }
    button { padding: 9px 16px; font: inherit; cursor: pointer; }
    #error { color: #b3261e; min-height: 1.4em; margin: 8px 0 0; font-size: 0.92rem; }
    #bookings { list-style: none; padding: 0; margin: 24px 0 0; }
    #bookings li {
      border: 1px solid #ddd; border-radius: 4px; padding: 12px 14px;
      margin-bottom: 8px; display: flex; justify-content: space-between; gap: 12px;
    }
    .when { color: #666; font-size: 0.88rem; }
    .empty { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h1>Room Booking</h1>
  <p class="sub">Book a conference room. Rooms cannot be double booked.</p>

  <form id="booking-form">
    <label>Title
      <input id="title" name="title" type="text" required>
    </label>
    <label>Room
      <select id="room" name="room"></select>
    </label>
    <label>Start
      <input id="start" name="start" type="datetime-local" required>
    </label>
    <label>End
      <input id="end" name="end" type="datetime-local" required>
    </label>
    <label>Attendees
      <input id="attendees" name="attendees" type="number" min="1" value="1" required>
    </label>
    <button id="submit" type="submit">Book room</button>
  </form>
  <p id="error" role="alert"></p>

  <h2>Bookings</h2>
  <ul id="bookings"></ul>

  <script src="/app.js"></script>
</body>
</html>
